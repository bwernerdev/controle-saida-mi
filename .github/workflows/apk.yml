name: Gerar APK Android

# Compila o APK da portaria e publica numa Release do GitHub (instalação direta).
# Roda a cada push em main que mexa no app, ou manualmente (Actions > Gerar APK Android > Run).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Java 21 (exigido pelo Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Sem android-actions/setup-android: o ubuntu-latest já traz o Android SDK
      # (ANDROID_HOME) com licenças aceitas, e a v3 da action quebra pedindo o
      # pacote "tools", que não existe mais. O Gradle baixa o que faltar.

      - name: Instalar dependências
        run: npm ci

      - name: Build web + copiar para o Android
        run: npm run build && npx cap sync android
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      # Chave fixa: sem ela o APK novo não instala por cima do antigo.
      - name: Restaurar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_B64 (ver CLAUDE.md)."; exit 1
          fi
          # tr: descarta tudo que não é base64 (\r\n, espaços, BOM). Regravar o segredo
          # pelo Bash: base64 -w0 assinatura/controle-saida-mi.p12 | gh secret set ANDROID_KEYSTORE_B64
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/assinatura.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/assinatura.p12" >> "$GITHUB_ENV"

      - name: Compilar APK (release assinado)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../saida
          cp app/build/outputs/apk/release/app-release.apk "../saida/Controle-de-Saida-MI-${APP_VERSION_NAME}.apk"

      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs saida/*.apk | head -3

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODO="produção"
          [ -z "${{ vars.SUPABASE_URL }}" ] && MODO="demonstração (Supabase ainda não configurado)"
          gh release create "v${APP_VERSION_NAME}" saida/*.apk \
            --title "Controle de Saída - MI ${APP_VERSION_NAME}" \
            --notes "APK da portaria, versão ${APP_VERSION_NAME}. Modo: ${MODO}. Commit ${GITHUB_SHA::7}." \
            --latest
